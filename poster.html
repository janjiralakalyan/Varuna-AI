<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build for Campus - Poster</title>
    <link rel="stylesheet" href="poster.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="poster-container">
        <div class="overlay"></div>
        <div class="content">
            <header>
                <h4 class="college-name">CMR COLLEGE OF ENGINEERING AND TECHNOLOGY</h4>
                <div class="divider"></div>
            </header>
            
            <main>
                <h2 class="sub-headline">PRESENTING</h2>
                <h1 class="main-title">BUILD FOR <span class="highlight">CAMPUS</span></h1>
                <p class="tagline">Innovate. Build. Transform CMRCET.</p>
                
                <div class="problem-box">
                    <h3>THE CHALLENGE</h3>
                    <p>Identify any problem within our campus and build a solution that makes life easier for students and faculty.</p>
                </div>
            </main>
            
            <footer>
                <div class="prize-pool">
                    <span class="label">PRIZE POOL</span>
                    <span class="amount">₹5,000</span>
                </div>
                
                <div class="cta">
                    <button class="register-btn">REGISTER NOW</button>
                    <p class="deadline">Registration Closing Soon!</p>
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
